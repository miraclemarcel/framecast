name: Release

# Push a tag like v1.0.0 to build the Windows installer and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # fetch-deps → typecheck → tests → build → NSIS installer (release/FrameCast-Setup-x64.exe)
      - run: npm run dist
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash release/FrameCast-Setup-x64.exe -Algorithm SHA256).Hash.ToLower() + '  FrameCast-Setup-x64.exe' | Out-File -Encoding ascii release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: FrameCast ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/FrameCast-Setup-x64.exe
            release/SHA256SUMS.txt
